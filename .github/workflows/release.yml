name: Release

on:
  push:
    tags:
      - "v*"
  # On-demand smoke run (e.g. after a risky merge touching the deploy
  # engine, the SSH layer, or key screens). Runs only the e2e job.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # First-run e2e smoke (connect a server -> add an app -> deploy) as the
  # release gate. Linux-only: it validates the shared logic (UI flow, SSH,
  # deploy engine), not the packaged mac/win artifacts.
  e2e:
    runs-on: ubuntu-latest
    # Inside the run: pnpm install + electron-vite build + Docker fixture
    # image build + a deploy that installs dependencies on the fixture
    # server (the e2e vitest config allows 10 min per test). Bounded so a
    # wedged Docker or Electron launch fails instead of hanging for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: E2E smoke
        # Electron cannot open a window on a headless runner — wrap in xvfb
        run: xvfb-run -a pnpm --filter @plantar/desktop test:e2e

  build:
    needs: e2e
    # workflow_dispatch runs only the smoke — never build or publish
    # distributables outside a v* tag push
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @plantar/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Сборки пока не подписываются: не искать сертификаты на macOS-раннере
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
